{% extends "base.html" %}

{% block content %}
<a href="{% url 'expenses:category-create' %}">add</a>

<table border="1">
	<thead>
		<tr>
			<th>name</th>
			<th>actions</th>
		</tr>
	</thead>
	<tbody>
		{% for obj in object_list %}
		<tr>
			<td>
				{{obj.name}}
			</td>
			<td>
				<a href="{% url 'expenses:category-update' obj.id %}">edit</a>
				<a href="{% url 'expenses:category-delete' obj.id %}">delete</a>
			</td>
		</tr>
		{% endfor %}
	</tbody>
</table>
<hr>
<table border="1">
	<tr>
		<th>Category</th>
		<th>Number of Expenses</th>
	</tr>
	{% for category in object_list %}
	<tr>
		<td>{{ category.name }}</td>
		<td>{{ category.expense_count }}</td>
	</tr>
	{% endfor %}
</table>
{% endblock %}
